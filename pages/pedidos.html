<body class="grey lighten-4">

 <!-- top nav -->
  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="/">El<span>Barrigon</span></a>
      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu">menu</i>
      </span>
    </div>
  </nav>

  <!-- side nav -->
  <ul id="side-menu" class="sidenav side-menu">
    <li><a class="subheader">ELBARRIGON</a></li>
    <li><a href="/" class="waves-effect">Home</a></li>
    <li><a href="/pages/about.html" class="waves-effect">About</a></li>
    <li><div class="divider"></div></li>
    <li><a href="/pages/contact.html" class="waves-effect">
      <i class="material-icons">mail_outline</i>Contact</a>
    </li>
  </ul>

  <!-- Contenido -->
  <div class="container" style="margin-top:40px; max-width:650px;">

    <div class="card z-depth-3">
      <div class="card-content">

        <h4 class="center orange-text text-darken-2">
          <i class="material-icons medium">restaurant_menu</i><br>
          Pedido
        </h4>

        <div class="divider"></div>

        <br>

        <!-- Platillo -->
        <div class="input-field">
          <select id="ListaPlatillos" name="ListaPlatillos">
            <option value="" disabled selected>Selecciona un platillo</option>
          </select>
          <label>Platillo</label>
        </div>

        <!-- Nombre -->
        <div class="input-field">
          <input type="text" id="nombre" name="nombre">
          <label for="nombre">Nombre del cliente</label>
        </div>

        <!-- Dirección -->
        <div class="input-field">
          <input type="text" id="direccion" name="direccion">
          <label for="direccion">Dirección</label>
        </div>

        <br>

        <!-- Botones -->
        <div class="center">

          <button id="guardar" type="submit"
            class="btn waves-effect waves-light orange">
            <i class="material-icons left">save</i>
            Guardar
          </button>

          <button type="reset"
            class="btn grey waves-effect waves-light"
            style="margin-left:10px;">
            <i class="material-icons left">close</i>
            Cancelar
          </button>

        </div>

      </div>
    </div>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>
