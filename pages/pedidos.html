  <!-- FORM -->
  <div class="container form-container">

    <div class="card z-depth-3 form-card">

      <div class="card-content">

        <span class="card-title center form-title">
          🍔 Nuevo Pedido
        </span>

        <form id="form-pedido">

          <div class="input-field">
            <select id="ListaPlatillos">
              <option value="" disabled selected>Selecciona un platillo</option>
            </select>
            <label>Platillo</label>
          </div>

          <div class="input-field">
            <input id="nombre" type="text" required>
            <label for="nombre">Nombre del cliente</label>
          </div>

          <div class="input-field">
            <input id="direccion" type="text" required>
            <label for="direccion">Dirección</label>
          </div>


        </form>

        <button type="button" id="obtenerUbicacion"
          class="btn waves-effect location-btn full-width">
          <i class="material-icons left">place</i>
          Obtener ubicación
        </button>

        <button type="submit" form="form-pedido"
          class="btn waves-effect waves-light form-btn full-width">
          Guardar Pedido
          <i class="material-icons right">send</i>
        </button>
        <div id="mapa"></div>

      </div>
    </div>

  </div>
