<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElBarrigon - Pedidos</title>

  <link rel="stylesheet" href="/css/materialize.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">

  <script src="/js/materialize.min.js"></script>
</head>

<body class="grey lighten-4">

  <!-- Menu superior -->
  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="/">ElBarrigon</a>
      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu">menu</i>
      </span>
    </div>
  </nav>

  <!-- Menu lateral -->
  <ul id="side-menu" class="sidenav side-menu">
    <li><a class="subheader">ElBarrigon</a></li>
    <li><a href="/" class="waves-effect">Inicio</a></li>
    <li><a href="/pages/pedidos.html" class="waves-effect">Pedidos</a></li>
    <li><a href="/pages/about.html" class="waves-effect">Acerca</a></li>
    <li><div class="divider"></div></li>
    <li>
      <a href="/pages/contact.html" class="waves-effect">
        <i class="material-icons">mail_outline</i>Contacto
      </a>
    </li>
  </ul>

  <!-- FORMULARIO -->
  <div class="container" style="margin-top:40px; max-width:650px;">

    <div class="card">
      <div class="card-content">

        <span class="card-title center">Nuevo Pedido</span>

        <div class="divider"></div>
        <br>
        <form id="form-pedido">

          <div class="input-field">
            <select id="ListaPlatillos">
              <option value="" disabled selected>Selecciona un platillo</option>
            </select>
            <label>Platillo</label>
          </div>

          <div class="input-field">
            <input id="nombre" type="text" required>
            <label for="nombre">Nombre del cliente</label>
          </div>

          <div class="input-field">
            <input id="direccion" type="text" required>
            <label for="direccion">Dirección</label>
          </div>

          <div class="input-field center">
            <button type="submit" class="btn-small">
              Guardar Pedido
            </button>
          </div>

        </form>

      </div>
    </div>

  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"></script>

  <script src="/js/firebase.js"></script>
  <script src="/js/pedidos.js"></script>

</body>
</html>
