<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElBarrigon</title>

  <link type="text/css" href="css/materialize.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link type="text/css" href="css/styles.css" rel="stylesheet">

  <script type="text/javascript" src="js/materialize.min.js"></script>
</head>

<body class="grey lighten-4">

  <!-- Menu lateral -->
  <ul id="side-menu" class="sidenav side-menu">
    <li><a class="subheader">ElBarrigon</a></li>
    <li><a href="" class="waves-effect">Inicio</a></li>
    <li><a href="pages/pedidos.html" class="waves-effect">Pedidos</a></li>
    <li><a href="pages/about.html" class="waves-effect">Acerca</a></li>
    <li><div class="divider"></div></li>
    <li><a href="pages/contact.html" class="waves-effect">
      <i class="material-icons">mail_outline</i>Contacto</a>
    </li>
  </ul>

  <!-- Menu superior -->
  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="/">ElBarrigon</span></a>
      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu">menu</i>
      </span>
    </div>
  </nav>

  <!-- LISTA DE PLATILLOS -->
  <div class="container recipes-container">

    <h5 class="section-title">🍽️ Platillos disponibles</h5>

    <div class="recipes"></div>

  </div>

  <!-- BOTÓN FLOTANTE -->
  <div class="center">
    <a class="btn-floating btn-large add-btn sidenav-trigger pulse"
      data-target="side-form">
      <i class="material-icons">add</i>
    </a>
  </div>

  <!-- SIDENAV FORM -->
  <div id="side-form" class="sidenav side-form">

    <form class="add-recipe container section">

      <h6 class="form-title">🍔 Nuevo platillo</h6>

      <div class="divider"></div>

      <div class="input-field">
        <input id="title" type="text" required>
        <label for="title">Nombre</label>
      </div>

      <div class="input-field">
        <input id="ingredients" type="text" required>
        <label for="ingredients">Ingredientes</label>
      </div>

      <div class="input-field">
        <input id="price" type="text" required>
        <label for="price">Precio</label>
      </div>
      <input id="foto" type="hidden" >
      <button class="btn waves-effect waves-light form-btn full-width">
        Agregar
        <i class="material-icons right">add</i>
      </button>
      <div id="camara"> 
        <video id="video">No hay video disponible</video>
      </div>
      <canvas id="canvas"></canvas>
      <div id="salida">
        <img id="foto" src="" alt="Foto del platillo">
      </div>

    </form>
    <button id="btnFoto" class="btn waves-effect waves-light form-btn full-width">
      Tomar foto
      <i class="material-icons right">camera_alt</i>
    </button>
  </div>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/6.0.1/firebase-firestore.js"></script>

  <script src="js/firebase.js"></script>
  <script src="js/index.js"></script>
  <script src="js/db.js"></script>

</body>
</html>
